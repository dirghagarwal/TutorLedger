name: Gemini Pro Review

on:
  push:
    branches: ["chatgpt/**"]

permissions:
  contents: read
  pull-requests: write

jobs:
  gemini-review:
    # One-time setup: register your Windows PC as a self-hosted runner
    # with labels: self-hosted, windows, tutorledger, and install/login to Antigravity CLI.
    runs-on: [self-hosted, windows, tutorledger]
    timeout-minutes: 30

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: git fetch origin main --no-tags

      - name: Build review diff
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          git diff --no-ext-diff --unified=80 origin/main...HEAD | Out-File -Encoding utf8 .gemini-review-diff.txt
          $lines = (Get-Content .gemini-review-diff.txt | Measure-Object -Line).Lines
          "Review diff lines: $lines"

      - name: Run Gemini Pro review
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $prompt = @"
          You are the independent senior reviewer for TutorLedger.
          REVIEW ONLY. Do not modify source files, do not commit, and do not deploy.

          Read:
          1. AGENTS.md
          2. GEMINI_REVIEW_PROTOCOL.md
          3. .gemini-review-diff.txt
          4. Surrounding repository files needed to validate findings.

          Review the current branch against origin/main.
          Focus on real bugs and production risks, especially data integrity, payments,
          payment allocations, session identity, dates/timezones, AI safety/context,
          performance/N+1, React/Next.js correctness, and UX race conditions.

          Return ONLY:
          BLOCKERS:
          HIGH:
          MEDIUM:
          LOW:
          COVERAGE:

          Each finding must include file/path, concrete issue, impact, and fix direction.
          Do not score or praise the code. Do not invent findings.
          "@
          $agy = Join-Path $env:USERPROFILE "AppData\Local\agy\bin\agy.exe"
          if (-not (Test-Path -LiteralPath $agy)) {
            throw "Antigravity CLI not found at $agy"
          }
          & $agy --version
          & $agy -p $prompt --model gemini-3.1-pro-high --effort high --output-format text --print-timeout 25m | Out-File -Encoding utf8 gemini-review.md

      - name: Comment review on PR
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $repo = "${{ github.repository }}"
          $branch = "${{ github.ref_name }}"
          $encodedBranch = [uri]::EscapeDataString($branch)
          $prs = Invoke-RestMethod -Method Get -Uri "https://api.github.com/repos/$repo/pulls?head=${{ github.repository_owner }}:$encodedBranch&state=open" -Headers $headers
          if (-not $prs -or $prs.Count -eq 0) { throw "No open PR found for branch $branch" }
          $prNumber = $prs[0].number
          $body = Get-Content -Raw gemini-review.md
          $payload = @{ body = $body } | ConvertTo-Json
          Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$repo/issues/$prNumber/comments" -Headers $headers -ContentType "application/json" -Body $payload

      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: gemini-review-${{ github.run_id }}
          path: gemini-review.md
          retention-days: 7
